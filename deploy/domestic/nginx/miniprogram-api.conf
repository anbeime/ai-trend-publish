# ============================================================
# 国内服务器 (39.108.254.228, 腾讯云) Nginx 配置
#
# 作用: 桥接微信小程序 → RackNerd FreeSwitch
# 
# 原因: 微信小程序只能访问已备案的 HTTPS 域名，
#       RackNerd 的 IP 无法备案，需要通过国内服务器转发。
#
# 部署位置: /etc/nginx/conf.d/miniprogram-api.conf
# 重载命令: nginx -t && nginx -s reload
# ============================================================

# 小程序 API 网关 (已备案域名)
server {
    listen 443 ssl;
    
    # 已备案域名 (请替换为你的实际域名)
    server_name api.YOUR_DOMAIN.com;
    
    # HTTPS 证书 (腾讯云可申请免费证书)
    ssl_certificate /etc/nginx/ssl/YOUR_DOMAIN.com.crt;
    ssl_certificate_key /etc/nginx/ssl/YOUR_DOMAIN.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # ---------- FreeSwitch API 代理 ----------
    # 小程序调用 /api/ai/* → 转发到 RackNerd FreeSwitch
    location /api/ai/ {
        # RackNerd VPS 的域名或 IP (请替换)
        # 如果有域名: https://fs.YOUR_DOMAIN.com/v1/
        # 如果无域名: http://RACKNERD_IP:3071/v1/
        proxy_pass http://RACKNERD_IP:3071/v1/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # AI API 需要较长超时
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
        
        # 支持 SSE 流式响应
        proxy_buffering off;
        proxy_cache off;
        
        # CORS 头 (小程序需要)
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }
    
    # ---------- FreeSwitch Enterprise 计费代理 ----------
    # 小程序调用 /api/billing/* → 转发到 RackNerd Enterprise
    location /api/billing/ {
        proxy_pass http://RACKNERD_IP:3073/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
    
    # ---------- FreeSwitch 健康检查 ----------
    location /api/health {
        proxy_pass http://RACKNERD_IP:3071/health;
        proxy_set_header Host $host;
    }
    
    # ---------- skill 商店代理 ----------
    location /api/skills/ {
        proxy_pass http://RACKNERD_IP/skills/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # ---------- draft-api.py 微信发布 (本地服务) ----------
    location /api/publish/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
    
    # ---------- 热点采集 (本地服务或直连) ----------
    location /api/hotspot/ {
        proxy_pass https://top.miyucaicai.cn/api/hot/;
        proxy_set_header Host top.miyucaicai.cn;
        proxy_set_header X-Real-IP $remote_addr;
        
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
    
    # ---------- 根路径 ----------
    location / {
        return 200 '{"service":"miniprogram-api-gateway","status":"running"}';
        add_header Content-Type application/json;
    }
}

# ============================================================
# HTTP → HTTPS 跳转
# ============================================================
server {
    listen 80;
    server_name api.YOUR_DOMAIN.com;
    return 301 https://$host$request_uri;
}
