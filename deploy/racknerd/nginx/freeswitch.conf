# ============================================================
# RackNerd VPS 上的 Nginx 配置
# 
# 部署位置: /etc/nginx/sites-available/freeswitch
# 启用方法: ln -s /etc/nginx/sites-available/freeswitch /etc/nginx/sites-enabled/
#
# 功能:
#   1. HTTPS + Let's Encrypt 证书
#   2. 反向代理 FreeSwitch API + Dashboard
#   3. 提供 skill 商店静态文件
#   4. 允许国内服务器反向代理访问
# ============================================================

# FreeSwitch API 服务 (直接对外)
server {
    listen 80;
    listen 443 ssl;
    
    # 域名 (请替换为你的实际域名)
    server_name fs.YOUR_DOMAIN.com;
    
    # HTTPS 证书 (请替换为你的证书路径)
    # 申请方式: certbot --nginx -d fs.YOUR_DOMAIN.com
    ssl_certificate /etc/letsencrypt/live/fs.YOUR_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fs.YOUR_DOMAIN.com/privkey.pem;
    
    # 如果没有 HTTPS，先使用 HTTP 80 端口
    # 申请证书后注释掉下面这行
    # ssl on;
    
    # ---------- 安全配置 ----------
    # 只允许国内服务器 IP 访问 (防止被滥用)
    # 39.108.254.228 = 你的腾讯云国内服务器
    allow 39.108.254.228;
    # 允许 RackNerd 本机访问
    allow 127.0.0.1;
    # 如需开放给其他 IP，添加 allow IP; 
    # deny all;  # 生产环境建议开启
    
    # ---------- FreeSwitch Core API ----------
    # 路径: /v1/* → FreeSwitch Core (端口 3071)
    location /v1/ {
        proxy_pass http://127.0.0.1:3071/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # AI API 需要较长超时
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
        
        # 支持 SSE 流式响应
        proxy_buffering off;
        proxy_cache off;
    }
    
    # ---------- FreeSwitch Enterprise (计费) ----------
    # 路径: /enterprise/* → FreeSwitch Enterprise (端口 3073)
    location /enterprise/ {
        proxy_pass http://127.0.0.1:3073/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
    
    # ---------- 健康检查 ----------
    location /health {
        proxy_pass http://127.0.0.1:3071/health;
        proxy_set_header Host $host;
    }
    
    # ---------- FreeSwitch Dashboard (管理面板) ----------
    # 路径: /dashboard/ → Dashboard (端口 3072)
    location /dashboard/ {
        proxy_pass http://127.0.0.1:3072/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # ---------- Skill 商店 (静态文件) ----------
    # 路径: /skills/ → /var/www/skill-store/
    location /skills/ {
        alias /var/www/skill-store/;
        index index.html;
        try_files $uri $uri/ /skills/index.html;
        
        # 允许 CORS (小程序需要)
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }
    
    # ---------- 根路径 ----------
    location / {
        return 200 '{"service":"FreeSwitch","status":"running","endpoints":{"api":"/v1/","billing":"/enterprise/","dashboard":"/dashboard/","skills":"/skills/"}}';
        add_header Content-Type application/json;
    }
}

# ============================================================
# HTTP → HTTPS 强制跳转 (申请证书后开启)
# ============================================================
server {
    listen 80;
    server_name fs.YOUR_DOMAIN.com;
    
    # 健康检查允许 HTTP
    location /health {
        proxy_pass http://127.0.0.1:3071/health;
    }
    
    # 其他请求跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
